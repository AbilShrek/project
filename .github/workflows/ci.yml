name: CI/CD Pipeline для Кодекса Нитей

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
    - name: Клонирование репозитория
      uses: actions/checkout@v4
    
    - name: Установка Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-html pytest-cov coverage flake8
    
    - name: Проверка стиля кода (flake8)
      run: |
        flake8 src/ --max-line-length=120 --ignore=E203,W503 || true
        flake8 tests/ --max-line-length=120 --ignore=E203,W503 || true
    
    - name: Запуск тестов с coverage
      run: |
        coverage run -m pytest tests/ -v
        coverage report -m
        coverage html
    
    - name: Генерация HTML отчёта pytest
      run: |
        pytest tests/ --html=report.html --self-contained-html -v
    
    - name: Сохранение артефактов
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-python-${{ matrix.python-version }}
        path: |
          report.html
          htmlcov/
          .coverage
      if: always()
    
    - name: Проверка покрытия
      run: |
        COVERAGE=$(coverage report | grep TOTAL | awk '{print $4}' | sed 's/%//')
        echo "Покрытие кода: $COVERAGE%"
        if [ $(echo "$COVERAGE < 80" | bc) -eq 1 ]; then
          echo "Ошибка: покрытие кода $COVERAGE% ниже 80%"
          exit 1
        fi
        echo "Покрытие кода $COVERAGE% - OK"

  build:
    name: Сборка и проверка
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Клонирование репозитория
      uses: actions/checkout@v4
    
    - name: Установка Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || true
    
    - name: Проверка импорта модулей
      run: |
        python -c "from src import *; print('Импорт успешен')"
    
    - name: Запуск main.py
      run: |
        python main.py